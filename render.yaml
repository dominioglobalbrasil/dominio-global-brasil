# DOMINIO GLOBAL — HOMOLOGACAO GRATUITA (Render Free + Supabase Free)
# Servidor Node sem disco persistente: todo o estado do jogo fica no projeto Supabase dedicado.
services:
  - type: web
    name: dominio-global-brasil-testes
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DG_STORAGE
        value: supabase
      - key: DG_PUBLIC_TEST
        value: "1"
      - key: DG_SECURE_COOKIES
        value: "1"
      - key: DG_LEGACY_GUEST
        value: "0"
      - key: TICK_MS
        value: "900000"
      - key: DG_MAX_CATCHUP
        value: "120"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DG_INVITE_CODE
        sync: false
